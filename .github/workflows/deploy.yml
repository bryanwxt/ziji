name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /ziji/
      - name: Add the audio clips (the iPad voice speaks until there are any)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download audio-store -p audio.tar.gz -D "$RUNNER_TEMP/audio" 2>/dev/null; then
            tar -xzf "$RUNNER_TEMP/audio/audio.tar.gz" -C dist
            echo "audio: $(ls dist/audio/clips 2>/dev/null | wc -l) clips"
          else
            echo "audio: no store yet"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
