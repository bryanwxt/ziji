name: Audio audition
on:
  workflow_dispatch:
    inputs:
      engines:
        description: Engines to (re)make; the others keep their clips from the last audition
        default: kokoro cosyvoice2 cosyvoice3 indextts2 indextts25 spark

permissions:
  contents: write
  actions: write

jobs:
  items:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          ENGINES: ${{ inputs.engines }}
        run: |
          # each engine and its voices (Spark: a copy of the shared prompt voice, and its own made-up woman's voice)
          all='[{"engine":"kokoro","voices":"v1.1/zf_002"},{"engine":"cosyvoice2","voices":"ref"},{"engine":"cosyvoice3","voices":"ref"},
            {"engine":"indextts2","voices":"ref"},{"engine":"indextts25","voices":"ref"},{"engine":"spark","voices":"ref female"}]'
          echo "matrix=$(jq -c --arg e "$ENGINES" '{include: [.[] | select(.engine as $x | $e | split(" ") | index($x))]}' <<<"$all")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsx scripts/audio/audition.ts build/audio/audition-jobs.json
      - uses: actions/upload-artifact@v4
        with: { name: audition-jobs, path: build/audio/audition-jobs.json }

  synth:
    needs: items
    runs-on: ubuntu-latest
    timeout-minutes: 200
    continue-on-error: true  # one engine failing never blocks the page
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.items.outputs.matrix) }}  # kokoro is the app's current voice, for reference
    steps:
      - uses: actions/checkout@v4
      - name: Room for the big models
        if: matrix.engine != 'kokoro'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost &
          wait; df -h /
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - uses: actions/download-artifact@v4
        with: { name: audition-jobs, path: build/audio }
      - run: bash scripts/audio/tts/setup.sh ${{ matrix.engine }}
        timeout-minutes: 60
      - name: Say the items in each voice
        timeout-minutes: 120  # a slow engine stops here and keeps the clips it made (results.json is saved as it goes)
        run: |
          df -h / && free -g
          for v in ${{ matrix.voices }}; do
            dir="out/${{ matrix.engine }}-${v//\//-}"
            python scripts/audio/tts/synth.py --jobs build/audio/audition-jobs.json --out "$dir" \
              --engine ${{ matrix.engine }} --voice "$v" || echo "::warning::${{ matrix.engine }} $v failed to start"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'audition-${{ matrix.engine }}', path: out, if-no-files-found: ignore }

  publish:
    needs: synth
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { pattern: 'audition-*', path: art }
      - name: Previous store
        run: |
          mkdir -p prev
          if gh release download audio-store -p audio.tar.gz -D "$RUNNER_TEMP/a"; then tar -xzf "$RUNNER_TEMP/a/audio.tar.gz" -C prev; fi
          mkdir -p prev/audio
      - run: rm -rf art/audition-jobs && npx tsx scripts/audio/pack-audition.ts art prev/audio out
      - name: Upload the store and redeploy
        run: |
          tar -czf audio.tar.gz -C out audio
          gh release view audio-store >/dev/null 2>&1 || gh release create audio-store --title "Audio clips" --notes "ZiJi's generated audio (scripts/audio). Not a code release." --target main
          gh release upload audio-store audio.tar.gz --clobber
          gh workflow run deploy.yml --ref main
